###############################################
# assets.i-portal.me — Docker Compose stack
#
#   app   : Laravel application — Nginx + PHP-FPM + queue worker (Supervisor)
#   db    : MySQL (latest) with a persistent volume
#
# Quick start:
#   cp .env.docker.example .env   # adjust values (or let the entrypoint create .env)
#   docker compose up -d --build
###############################################

# Stable project name (containers/volumes/network), independent of the folder name.
name: assets

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: assets-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      APP_NAME: "${APP_NAME:-assets.i-portal.me}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      # Persistent encryption key from the host .env (scripts/docker-preflight.sh
      # generates it once). Blank = the entrypoint generates a throwaway key.
      APP_KEY: "${APP_KEY:-}"
      # Local timezone for due dates and reminder times (e.g. Europe/Athens)
      APP_TIMEZONE: "${APP_TIMEZONE:-UTC}"
      # Optional security toggles (see README)
      REQUIRE_2FA_FOR_ADMINS: "${REQUIRE_2FA_FOR_ADMINS:-false}"
      PORTAL_ADMIN_ROLE: "${PORTAL_ADMIN_ROLE:-Admin}"
      # Optional: title deed import key/model (can also be set in Settings → Portal)
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-opus-5}"
      # APP_URL follows WEB_PORT automatically unless you set APP_URL explicitly
      APP_URL: "${APP_URL:-http://localhost:${WEB_PORT:-8080}}"
      # Generate URLs from APP_URL (the published port differs from the internal one)
      APP_FORCE_ROOT_URL: "true"
      # Containerised app logs to stderr so they surface via `docker compose logs`
      LOG_CHANNEL: stderr
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Optional error tracking (blank = disabled)
      SENTRY_LARAVEL_DSN: "${SENTRY_LARAVEL_DSN:-}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-assets}"
      DB_USERNAME: "${DB_USERNAME:-assets}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      CACHE_STORE: "${CACHE_STORE:-database}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      # Optional one-shot admin bootstrap (entrypoint runs make:admin when both are set)
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_NAME: "${ADMIN_NAME:-Admin}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
    volumes:
      # Persist user-uploaded files and logs across rebuilds
      - app_storage:/var/www/html/storage
    networks:
      - portal

  db:
    image: mysql:latest
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-assets}"
      MYSQL_USER: "${DB_USERNAME:-assets}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
    # No host port: the app reaches MySQL over the internal network. To use a
    # local DB tool temporarily, add to docker-compose.override.yml:
    #   services: { db: { ports: ["127.0.0.1:3307:3306"] } }
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - portal

volumes:
  db_data:
  app_storage:

networks:
  portal:
    driver: bridge
